<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laserreach Intelli Overlay</title>
  <style>
    :root {
      --bg: rgba(8, 10, 14, 0.72);
      --bg-strong: rgba(14, 18, 27, 0.94);
      --line: rgba(124, 163, 255, 0.45);
      --text: #edf3ff;
      --muted: #9fb0d0;
      --ok: #50d37a;
      --warn: #ffc654;
      --blue: #5f98ff;
      --danger: #ff6e6e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
    }

    .bar-shell {
      margin: 10px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(170deg, rgba(19, 24, 37, 0.86), rgba(6, 7, 11, 0.78));
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .bar {
      min-height: 52px;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      align-items: center;
      padding: 8px 10px;
      column-gap: 10px;
      row-gap: 8px;
    }

    .drag-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
      -webkit-app-region: drag;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .headline {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .headline-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .headline-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 100%;
      -webkit-app-region: no-drag;
    }

    .btn {
      border: 1px solid rgba(131, 159, 228, 0.45);
      background: rgba(47, 63, 98, 0.35);
      color: var(--text);
      border-radius: 9px;
      height: 34px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.14s ease, background 0.14s ease;
    }

    .btn:hover { border-color: rgba(151, 184, 255, 0.7); background: rgba(66, 90, 140, 0.5); }
    .btn:focus-visible { outline: 2px solid rgba(169, 200, 255, 0.9); outline-offset: 1px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: rgba(70, 117, 218, 0.66); }
    .btn.ok { background: rgba(52, 138, 86, 0.66); border-color: rgba(111, 227, 157, 0.55); }
    .btn.warn { background: rgba(137, 107, 43, 0.6); border-color: rgba(255, 197, 81, 0.5); }
    .btn.danger { background: rgba(132, 51, 51, 0.56); border-color: rgba(255, 120, 120, 0.5); }

    .icon-btn {
      width: 32px;
      min-width: 32px;
      padding: 0;
      text-align: center;
      font-weight: 700;
    }

    .dock {
      display: none;
      border-top: 1px solid rgba(122, 161, 255, 0.28);
      background: var(--bg-strong);
      padding: 8px;
      gap: 8px;
    }

    .dock.visible { display: flex; align-items: center; flex-wrap: wrap; }

    .quick-asks {
      width: 100%;
      display: none;
      gap: 6px;
      flex-wrap: wrap;
    }

    .quick-asks.show { display: flex; }

    .quick-ask-btn {
      border: 1px solid rgba(124, 163, 255, 0.52);
      background: rgba(52, 74, 122, 0.58);
      color: var(--text);
      border-radius: 999px;
      height: 28px;
      padding: 0 10px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quick-ask-btn:hover {
      border-color: rgba(160, 191, 255, 0.75);
      background: rgba(70, 99, 160, 0.66);
    }

    .input {
      flex: 1;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(124, 163, 255, 0.45);
      background: rgba(13, 16, 24, 0.95);
      color: var(--text);
      padding: 0 10px;
      outline: none;
      font-size: 12px;
    }

    .input::placeholder { color: #7f94bf; }

    select.input {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    .status-pill {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      color: #dce9ff;
      background: rgba(69, 94, 146, 0.5);
      border: 1px solid rgba(137, 166, 236, 0.5);
      max-width: 210px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      border-radius: 10px;
      background: rgba(13, 18, 31, 0.96);
      border: 1px solid rgba(121, 152, 214, 0.45);
      padding: 10px 12px;
      font-size: 12px;
      display: none;
      z-index: 30;
    }

    .toast.show { display: block; }
    .toast.error { border-color: rgba(255, 130, 130, 0.55); color: #ffd1d1; }

    .settings {
      position: fixed;
      right: 16px;
      top: 66px;
      width: 360px;
      max-width: calc(100% - 28px);
      border-radius: 12px;
      border: 1px solid rgba(129, 162, 236, 0.45);
      background: rgba(11, 15, 24, 0.97);
      box-shadow: 0 20px 44px rgba(0,0,0,0.48);
      display: none;
      z-index: 22;
      overflow: hidden;
    }

    .settings.show { display: block; }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(122, 156, 222, 0.3);
      font-size: 13px;
      font-weight: 700;
    }

    .settings-body {
      padding: 10px 12px 12px;
      display: grid;
      gap: 8px;
    }

    .label {
      display: block;
      font-size: 11px;
      color: #9db1d6;
      margin-bottom: 4px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .small {
      font-size: 11px;
      color: #9eb1d3;
    }

    .meeting-alert {
      color: #ffe8af;
      border-color: rgba(255, 201, 89, 0.6);
      background: rgba(122, 86, 23, 0.58);
    }

    @media (max-width: 1160px) {
      .bar {
        grid-template-columns: 1fr;
      }
      .controls {
        justify-content: flex-start;
      }
      .status-pill {
        max-width: 100%;
      }
    }

    @media (max-width: 760px) {
      .bar {
        padding: 7px 8px;
      }
      .btn {
        height: 32px;
        padding: 0 8px;
        font-size: 11px;
      }
      .icon-btn {
        width: 30px;
        min-width: 30px;
      }
      .headline-sub {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="bar-shell">
    <div class="bar">
      <div class="drag-zone">
        <img src="assets/laserreach-logo.png" alt="Laserreach" class="logo" />
        <div class="headline">
          <div id="headlineTitle" class="headline-title">Laserreach Intelli</div>
          <div id="headlineSub" class="headline-sub">Sign in to start live call intelligence.</div>
        </div>
      </div>

      <div class="controls">
        <span id="meetingPill" class="status-pill">No meeting soon</span>
        <button id="signinBtn" class="btn primary">Sign In</button>
        <button id="listenBtn" class="btn" disabled>Start</button>
        <button id="summaryBtn" class="btn" disabled>Summary</button>
        <button id="meetingBtn" class="btn" disabled>Meeting</button>
        <button id="transcriptBtn" class="btn" disabled>Transcript</button>
        <button id="askBtn" class="btn">Ask</button>
        <button id="settingsBtn" class="btn icon-btn">⚙</button>
        <button id="pinBtn" class="btn icon-btn">📌</button>
        <button id="minBtn" class="btn icon-btn">−</button>
        <button id="closeBtn" class="btn icon-btn">×</button>
      </div>
    </div>

    <div id="promptDock" class="dock">
      <input id="promptInput" class="input" placeholder="Ask for call coaching, objection handling, or next-best action..." />
      <button id="sendPromptBtn" class="btn primary">Analyze</button>
      <div id="clarifyButtons" class="quick-asks"></div>
    </div>
  </div>

  <div id="settingsPanel" class="settings">
    <div class="settings-header">
      <span>Hosted Settings</span>
      <button id="settingsCloseBtn" class="btn icon-btn">×</button>
    </div>
    <div class="settings-body">
      <div>
        <label class="label" for="backendInput">Backend URL</label>
        <input id="backendInput" class="input" placeholder="http://127.0.0.1:8788" />
      </div>
      <div>
        <label class="label" for="frontendInput">Frontend URL (optional)</label>
        <input id="frontendInput" class="input" placeholder="http://localhost:3100" />
      </div>
      <div>
        <label class="label" for="tenantSelect">Workspace</label>
        <div class="row">
          <select id="tenantSelect" class="input"></select>
          <button id="refreshOrgsBtn" class="btn">Refresh</button>
        </div>
        <div class="small">Choose your org workspace. If empty, set Org ID manually below.</div>
      </div>
      <div>
        <label class="label" for="tenantInput">Org ID (optional override)</label>
        <input id="tenantInput" class="input" placeholder="orgl" />
      </div>
      <div class="row">
        <div style="flex:1">
          <label class="label" for="modelInput">Model</label>
          <input id="modelInput" class="input" value="gpt-5-mini" />
        </div>
        <div style="width:120px">
          <label class="label" for="lookaheadInput">Lookahead (min)</label>
          <input id="lookaheadInput" class="input" value="30" />
        </div>
      </div>
      <div class="small" id="authSummary">Not signed in.</div>
      <div class="row">
        <button id="saveSettingsBtn" class="btn primary">Save</button>
        <button id="reauthBtn" class="btn">Sign In</button>
        <button id="signoutBtn" class="btn danger">Sign Out</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API = window.electronAPI || {
      getHostedConfig: async () => ({ success: true, config: { backendUrl: 'http://127.0.0.1:8788', frontendUrl: 'http://localhost:3100', tenantId: '', jwtToken: '', analysisModel: 'gpt-5-mini', lookaheadMinutes: 30 } }),
      setHostedConfig: async (config) => ({ success: true, config }),
      getHostedReminders: async () => ({ success: true, reminders: [], count: 0 }),
      authOpenLogin: async () => ({ success: false, error: 'Electron API unavailable' }),
      authLoginPassword: async () => ({ success: false, error: 'Electron API unavailable' }),
      authSignOut: async () => ({ success: true }),
      authStatus: async () => ({ success: true, authenticated: false }),
      authListOrgs: async () => ({ success: true, orgs: [] }),
      authOpenExternal: async () => ({ success: true }),
      onAuthUpdated: () => {},
      onQuickAsk: () => {},
      openOverlayPanel: async () => ({ success: true }),
      closeOverlayPanel: async () => ({ success: true }),
      listOverlayPanels: async () => ({ success: true, keys: [] }),
      windowMinimize: async () => ({ success: true }),
      windowClose: async () => ({ success: true }),
      windowTogglePin: async () => ({ success: true, pinned: true }),
      sendPrompt: () => {},
      onResponse: () => {},
      sendAnalysisRequest: () => {},
      onAnalysisResponse: () => {},
      onStatus: () => {},
      onModelStatus: () => {},
      asrStart: () => {},
      asrSendChunkF32: () => {},
      asrStop: () => {},
      onASRMessage: () => {},
      sessionStart: () => {},
      sessionAppendTranscript: () => {},
      sessionAppendAnalysis: () => {},
      sessionEnd: () => {},
      getSession: async () => ({ success: false }),
      listSessions: async () => ({ success: false }),
      searchSessions: async () => ({ success: false }),
    };

    const state = {
      config: null,
      auth: null,
      listening: false,
      transcript: '',
      transcriptSegments: [],
      pendingAnalysis: new Map(),
      pendingPrompt: new Map(),
      mediaStream: null,
      audioCtx: null,
      sourceNode: null,
      processor: null,
      activeReminder: null,
      reminderTimer: null,
      lastReminderAlertId: '',
      lastTranscriptSegment: '',
      transcriptPanelLive: false,
      transcriptPanelRefreshTimer: null,
      autoInsightEnabled: true,
      autoInsightTimer: null,
      autoInsightInFlight: false,
      autoInsightLastRunAt: 0,
      autoInsightLastAnalyzedLen: 0,
      autoInsightMinChars: 80,
      clarificationPrompts: [],
      pinned: true,
      orgs: [],
    };

    const els = {
      headlineTitle: document.getElementById('headlineTitle'),
      headlineSub: document.getElementById('headlineSub'),
      meetingPill: document.getElementById('meetingPill'),
      signinBtn: document.getElementById('signinBtn'),
      listenBtn: document.getElementById('listenBtn'),
      summaryBtn: document.getElementById('summaryBtn'),
      meetingBtn: document.getElementById('meetingBtn'),
      transcriptBtn: document.getElementById('transcriptBtn'),
      askBtn: document.getElementById('askBtn'),
      settingsBtn: document.getElementById('settingsBtn'),
      pinBtn: document.getElementById('pinBtn'),
      minBtn: document.getElementById('minBtn'),
      closeBtn: document.getElementById('closeBtn'),
      promptDock: document.getElementById('promptDock'),
      promptInput: document.getElementById('promptInput'),
      sendPromptBtn: document.getElementById('sendPromptBtn'),
      clarifyButtons: document.getElementById('clarifyButtons'),
      settingsPanel: document.getElementById('settingsPanel'),
      settingsCloseBtn: document.getElementById('settingsCloseBtn'),
      backendInput: document.getElementById('backendInput'),
      frontendInput: document.getElementById('frontendInput'),
      tenantSelect: document.getElementById('tenantSelect'),
      refreshOrgsBtn: document.getElementById('refreshOrgsBtn'),
      tenantInput: document.getElementById('tenantInput'),
      modelInput: document.getElementById('modelInput'),
      lookaheadInput: document.getElementById('lookaheadInput'),
      authSummary: document.getElementById('authSummary'),
      saveSettingsBtn: document.getElementById('saveSettingsBtn'),
      reauthBtn: document.getElementById('reauthBtn'),
      signoutBtn: document.getElementById('signoutBtn'),
      toast: document.getElementById('toast'),
    };

    function nowIso() {
      return new Date().toISOString();
    }

    function showToast(message, type = 'info', timeoutMs = 2800) {
      els.toast.textContent = String(message || '');
      els.toast.className = `toast show${type === 'error' ? ' error' : ''}`;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        els.toast.className = 'toast';
      }, timeoutMs);
    }

    function parseDate(value) {
      if (!value) return null;
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function formatRelativeMinutes(target) {
      const dt = parseDate(target);
      if (!dt) return '';
      const mins = Math.round((dt.getTime() - Date.now()) / 60000);
      if (mins < 0) return `${Math.abs(mins)}m ago`;
      if (mins < 1) return 'now';
      return `in ${mins}m`;
    }

    function hasAuth() {
      return Boolean(state.config && state.config.jwtToken && state.config.tenantId && state.config.backendUrl);
    }

    function renderOrgOptions() {
      const select = els.tenantSelect;
      if (!select) return;
      const current = String(state.config?.tenantId || '').trim();
      select.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = state.orgs.length ? 'Select workspace...' : 'No workspaces loaded';
      select.appendChild(placeholder);
      for (const org of state.orgs) {
        const option = document.createElement('option');
        option.value = org.org_id;
        option.textContent = org.name ? `${org.name} (${org.org_id})` : org.org_id;
        select.appendChild(option);
      }
      if (current) {
        select.value = current;
      }
    }

    async function refreshOrgOptions() {
      if (!state.auth?.authenticated) {
        state.orgs = [];
        renderOrgOptions();
        return;
      }
      const out = await API.authListOrgs();
      if (!out?.success) {
        state.orgs = [];
        renderOrgOptions();
        return;
      }
      state.orgs = Array.isArray(out.orgs) ? out.orgs : [];
      renderOrgOptions();
      const current = String(state.config?.tenantId || '').trim();
      const hasCurrent = current && state.orgs.some((o) => String(o?.org_id || '') === current);
      if (state.orgs.length && (!hasCurrent || !current)) {
        const nextOrg = state.orgs[0]?.org_id || '';
        els.tenantSelect.value = nextOrg;
        els.tenantInput.value = nextOrg;
      }
    }

    function updateButtons() {
      const ready = hasAuth();
      els.listenBtn.disabled = !ready;
      els.summaryBtn.disabled = !ready;
      els.meetingBtn.disabled = !ready;
      els.transcriptBtn.disabled = !ready;
      els.signinBtn.textContent = ready ? 'Signed In' : 'Sign In';
      els.signinBtn.classList.toggle('ok', ready);
      els.listenBtn.classList.toggle('ok', state.listening);
      els.listenBtn.textContent = state.listening ? 'Stop' : 'Start';
      els.pinBtn.textContent = state.pinned ? '📌' : '📍';
    }

    function updateAuthSummary() {
      if (!state.auth || !state.auth.authenticated) {
        els.authSummary.textContent = 'Not signed in.';
        return;
      }
      const user = state.auth.user || {};
      const id = user.username || user.email || 'signed-in user';
      els.authSummary.textContent = `Signed in as ${id}${state.config?.tenantId ? ` • org ${state.config.tenantId}` : ''}`;
    }

    function updateMeetingHeadline() {
      if (!state.activeReminder) {
        els.meetingPill.className = 'status-pill';
        els.meetingPill.textContent = 'No meeting soon';
        return;
      }
      const r = state.activeReminder;
      const when = formatRelativeMinutes(r.scheduled_at || r.next_run_at || '');
      const person = r.person_name || r.person_email || 'meeting contact';
      els.meetingPill.textContent = `${person} ${when ? `(${when})` : ''}`;
      const minutes = Number(r.in_minutes || NaN);
      if (Number.isFinite(minutes) && minutes >= 0 && minutes <= 10) {
        els.meetingPill.className = 'status-pill meeting-alert';
      } else {
        els.meetingPill.className = 'status-pill';
      }
    }

    function setHeadline(title, subtitle) {
      if (title) els.headlineTitle.textContent = title;
      if (subtitle) els.headlineSub.textContent = subtitle;
    }

    function transcriptPanelPayload() {
      return {
        key: 'live_transcript',
        title: 'Live transcript',
        subtitle: 'Streaming notes for this call',
        content: state.transcript || 'No transcript yet.',
        width: 560,
        height: 520,
      };
    }

    function autoInsightPrompt() {
      return [
        'Produce actionable live call coaching from the transcript.',
        'Output concise sections: summary, actionItems, questions, topics.',
        'Separate pain points from objections and cite evidence from transcript wording.',
        'Keep it practical for a sales rep on a live call. No filler.',
      ].join(' ');
    }

    async function openPanel(payload) {
      const res = await API.openOverlayPanel(payload || {});
      if (!res || !res.success) throw new Error(res?.error || 'panel_open_failed');
      return res;
    }

    async function openMeetingPanel() {
      const r = state.activeReminder;
      if (!r) {
        showToast('No upcoming meeting detected.', 'error');
        return;
      }
      const content = [
        `Contact: ${r.person_name || r.person_email || 'Unknown'}`,
        `Company: ${r.company_name || 'Unknown company'}`,
        `When: ${r.scheduled_at || 'Unknown time'}`,
        `Pipeline: ${r.pipeline_id || 'N/A'}`,
        '',
        r.message_preview || 'No message preview available.',
      ].join('\n');

      await openPanel({
        key: `meeting_${r.event_id || r.pipeline_id || 'active'}`,
        title: 'Meeting context',
        subtitle: `${r.person_name || r.person_email || 'Contact'} • ${r.company_name || 'Account'}`,
        content,
        chips: [r.pipeline_status ? `status: ${r.pipeline_status}` : '', formatRelativeMinutes(r.scheduled_at || '')].filter(Boolean),
        links: r.person_linkedin_url ? [{ label: 'LinkedIn profile', href: r.person_linkedin_url }] : [],
        width: 470,
        height: 320,
      });
    }

    async function openTranscriptPanel() {
      if (!state.transcript.trim()) {
        showToast('No transcript yet. Start listening first.', 'error');
        return;
      }
      state.transcriptPanelLive = true;
      await openPanel(transcriptPanelPayload());
    }

    function compactText(v, n = 240) {
      const s = String(v || '').trim();
      if (s.length <= n) return s;
      return `${s.slice(0, n - 1)}…`;
    }

    function section(title, items) {
      if (!Array.isArray(items) || !items.length) return '';
      return `${title}:\n${items.map((v, i) => `${i + 1}. ${String(v || '').trim()}`).join('\n')}`;
    }

    function toShortStrings(items, maxItems = 3) {
      if (!Array.isArray(items)) return [];
      return items
        .map((item) => {
          if (typeof item === 'string') return String(item || '').trim();
          if (!item || typeof item !== 'object') return '';
          return String(item.text || item.question || item.action || item.topic || item.reason || '').trim();
        })
        .filter(Boolean)
        .slice(0, maxItems);
    }

    function uniqueStrings(items, maxItems = 4) {
      const seen = new Set();
      const out = [];
      for (const raw of Array.isArray(items) ? items : []) {
        const item = String(raw || '').trim();
        if (!item) continue;
        const key = item.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(item);
        if (out.length >= maxItems) break;
      }
      return out;
    }

    function toPainPoints(items, maxItems = 3) {
      if (!Array.isArray(items)) return [];
      return items
        .map((item) => {
          if (typeof item === 'string') {
            return { pain: String(item || '').trim(), inference: '', evidence: '' };
          }
          if (!item || typeof item !== 'object') return null;
          return {
            pain: String(item.pain || item.title || item.name || '').trim(),
            inference: String(item.inference || item.reasoning || item.reason || '').trim(),
            evidence: String(item.evidence || item.quote || item.source || '').trim(),
          };
        })
        .filter((item) => item && (item.pain || item.inference || item.evidence))
        .slice(0, maxItems);
    }

    function normalizeDealSignal(input) {
      if (!input) return { rating: '', reasoning: '' };
      if (typeof input === 'string') {
        const raw = String(input).trim();
        let rating = '';
        let reasoning = raw;
        const split = raw.match(/^([A-Za-z ]+?)\s*(?:→|->|:|-)\s*(.+)$/);
        if (split) {
          rating = String(split[1] || '').trim().toLowerCase();
          reasoning = String(split[2] || '').trim();
        }
        const reasoningSplit = reasoning.match(/(?:^|\b)Reasoning:\s*(.+)$/i);
        if (reasoningSplit && reasoningSplit[1]) {
          reasoning = String(reasoningSplit[1] || '').trim();
        }
        return { rating, reasoning };
      }
      if (typeof input !== 'object') return { rating: '', reasoning: '' };
      return {
        rating: String(input.rating || '').trim().toLowerCase(),
        reasoning: String(input.reasoning || '').trim(),
      };
    }

    function toClarificationPrompts({ questions, activities, painPoints, objections }) {
      const q = toShortStrings(questions || [], 4);
      const a = toShortStrings(activities || [], 3).map((item) => (
        /\?$/.test(item)
          ? item
          : `How should I execute this now: ${item}?`
      ));
      const p = (Array.isArray(painPoints) ? painPoints : [])
        .map((pp) => String(pp?.pain || '').trim())
        .filter(Boolean)
        .slice(0, 2)
        .map((pain) => `What should I ask to validate "${pain}" without sounding pushy?`);
      const o = toShortStrings(objections || [], 2).map((obj) => `How should I respond to this objection: ${obj}?`);
      return uniqueStrings([...q, ...a, ...p, ...o], 5);
    }

    function renderClarifyButtons() {
      const wrap = els.clarifyButtons;
      if (!wrap) return;
      const prompts = Array.isArray(state.clarificationPrompts) ? state.clarificationPrompts : [];
      if (!prompts.length) {
        wrap.innerHTML = '';
        wrap.classList.remove('show');
        return;
      }
      wrap.classList.add('show');
      wrap.innerHTML = prompts
        .map((prompt, idx) => `<button class="quick-ask-btn" data-qidx="${idx}" title="${String(prompt || '').replace(/"/g, '&quot;')}">${String(prompt || '')}</button>`)
        .join('');
      Array.from(wrap.querySelectorAll('.quick-ask-btn')).forEach((btn) => {
        btn.addEventListener('click', async () => {
          const idx = Number(btn.getAttribute('data-qidx') || -1);
          const q = prompts[idx];
          if (!q) return;
          await askClarificationQuestion(q, { source: 'suggested' });
        });
      });
    }

    function extractAnswerText(result) {
      const parsed = result?.results || {};
      const direct = parsed.answer || parsed.summary || result?.raw?.text || '';
      const text = String(direct || '').trim();
      return text || 'No answer returned.';
    }

    async function openQuestionAnswerPanel(question, result, opts = {}) {
      const answer = compactText(extractAnswerText(result), 1200);
      const sourceChip = opts.source ? String(opts.source) : 'manual';
      await openPanel({
        key: 'qa_latest',
        title: 'Clarification answer',
        subtitle: compactText(String(question || ''), 120),
        content: `Question:\n${question}\n\nAnswer:\n${answer}`,
        chips: ['qa', sourceChip, `segments: ${state.transcriptSegments.length}`],
        width: 520,
        height: 320,
      });
    }

    async function askClarificationQuestion(question, opts = {}) {
      const q = String(question || '').trim();
      if (!q) return;
      try {
        const result = await runAnalysis(q, 'full');
        if (!result) return;
        await openQuestionAnswerPanel(q, result, opts);
      } catch (err) {
        showToast(err.message || String(err), 'error', 4200);
      }
    }

    async function openAnalysisPanels(result, opts = {}) {
      const parsed = result?.results || {};
      const summary = compactText(parsed.summary || result?.raw?.text || 'No summary generated.', 420);
      const suggestions = parsed.suggestions || {};
      const actionItems = toShortStrings(suggestions.actionItems || parsed.next_actions || parsed.nextActions || []);
      const questions = toShortStrings(suggestions.questions || parsed.recommended_questions || parsed.recommendedQuestions || []);
      const topics = toShortStrings(suggestions.topics || []);
      const activities = toShortStrings(suggestions.activities || []);
      const painPoints = toPainPoints(parsed.painPoints || parsed.pain_points || []);
      const objections = toShortStrings(parsed.objections || []);
      const qualificationGaps = toShortStrings(parsed.qualification_gaps || parsed.qualificationGaps || []);
      const dealSignal = normalizeDealSignal(parsed.deal_signal || parsed.dealSignal || {});
      const clarificationPrompts = toClarificationPrompts({ questions, activities, painPoints, objections });
      state.clarificationPrompts = clarificationPrompts;
      renderClarifyButtons();
      const liveMode = Boolean(opts.live);
      const suffix = liveMode ? 'live' : 'manual';
      const subtitle = state.activeReminder?.person_name || state.activeReminder?.person_email || 'Live call';
      const sections = [
        `Summary:\n${summary}`,
        section('Pain points', painPoints.map((p) => [p.pain, p.inference, p.evidence ? `Evidence: ${p.evidence}` : ''].filter(Boolean).join(' — '))),
        section('Objections', objections),
        section('Qualification gaps', qualificationGaps),
        section('Next best actions', actionItems),
        section('Suggested questions', questions),
        section('Topics to emphasize', topics),
        section('Suggested activities', activities),
      ].filter(Boolean).join('\n\n');

      await openPanel({
        key: `ai_coach_${suffix}`,
        title: liveMode ? 'AI coach (live)' : 'AI coach',
        subtitle,
        content: sections,
        coach: {
          summary,
          dealSignal,
          painPoints,
          objections,
          qualificationGaps,
          actionItems,
          questions,
          topics,
          activities,
          clarificationPrompts,
        },
        chips: ['ai coach', `segments: ${state.transcriptSegments.length}`, liveMode ? 'auto' : 'manual'],
        width: 520,
        height: 430,
      });
    }

    async function runAnalysis(prompt, analysisType = 'full') {
      if (!hasAuth()) {
        showToast('Sign in and set tenant first.', 'error');
        return;
      }
      if (!state.transcript.trim()) {
        showToast('Need transcript data before analysis.', 'error');
        return;
      }

      const id = `ana_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
      const req = {
        id,
        prompt,
        analysisType,
        transcript: state.transcript,
        model: state.config.analysisModel || 'gpt-5-mini',
        max_completion_tokens: 14000,
        pipeline_id: state.activeReminder?.pipeline_id || state.config.defaultPipelineId || undefined,
        event_id: state.activeReminder?.event_id || undefined,
      };

      const out = await new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          state.pendingAnalysis.delete(id);
          reject(new Error('analysis_timeout'));
        }, 90000);
        state.pendingAnalysis.set(id, {
          resolve: (v) => {
            clearTimeout(timer);
            resolve(v);
          },
          reject: (e) => {
            clearTimeout(timer);
            reject(e);
          },
        });
        API.sendAnalysisRequest(req);
      });

      if (out.error) throw new Error(out.error);
      return out;
    }

    async function startListening() {
      if (state.listening) return;
      if (!hasAuth()) {
        showToast('Sign in first.', 'error');
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      state.mediaStream = stream;
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
      state.sourceNode = state.audioCtx.createMediaStreamSource(stream);
      state.processor = state.audioCtx.createScriptProcessor(4096, 1, 1);
      state.lastTranscriptSegment = '';
      state.autoInsightLastAnalyzedLen = 0;
      state.autoInsightLastRunAt = 0;

      state.processor.onaudioprocess = (event) => {
        if (!state.listening) return;
        const chunk = event.inputBuffer.getChannelData(0).slice();
        API.asrSendChunkF32(chunk.buffer);
      };

      state.sourceNode.connect(state.processor);
      state.processor.connect(state.audioCtx.destination);
      API.asrStart({ sampleRate: state.audioCtx.sampleRate, updateMs: 700 });

      const sid = `sess_${Date.now()}`;
      state.sessionId = sid;
      API.sessionStart(sid, {
        started_at: nowIso(),
        pipeline_id: state.activeReminder?.pipeline_id || '',
        event_id: state.activeReminder?.event_id || '',
      });

      state.listening = true;
      setHeadline('Listening live', state.activeReminder ? `${state.activeReminder.person_name || state.activeReminder.person_email || 'Contact'} • ${state.activeReminder.company_name || 'Account'}` : 'Capturing live call audio');
      updateButtons();
      openPanel({
        key: 'ai_coach_live',
        title: 'AI coach (live)',
        subtitle: state.activeReminder?.person_name || state.activeReminder?.person_email || 'Live call',
        content: 'Listening now. Live suggestions will appear as transcript arrives.',
        chips: ['ai coach', 'warming up'],
        width: 520,
        height: 430,
      }).catch(() => {});
    }

    async function stopListening() {
      if (!state.listening) return;
      state.listening = false;

      try { API.asrStop(); } catch (_) {}
      try { state.processor && state.processor.disconnect(); } catch (_) {}
      try { state.sourceNode && state.sourceNode.disconnect(); } catch (_) {}
      try { state.audioCtx && state.audioCtx.close(); } catch (_) {}
      try {
        if (state.mediaStream) {
          state.mediaStream.getTracks().forEach((t) => t.stop());
        }
      } catch (_) {}

      state.processor = null;
      state.sourceNode = null;
      state.audioCtx = null;
      state.mediaStream = null;
      if (state.transcriptPanelRefreshTimer) {
        window.clearTimeout(state.transcriptPanelRefreshTimer);
        state.transcriptPanelRefreshTimer = null;
      }
      if (state.autoInsightTimer) {
        window.clearTimeout(state.autoInsightTimer);
        state.autoInsightTimer = null;
      }

      if (state.sessionId) {
        API.sessionEnd(state.sessionId, {
          ended_at: nowIso(),
          transcript_len: state.transcript.length,
        });
      }

      setHeadline('Laserreach Intelli', state.activeReminder ? `${state.activeReminder.person_name || state.activeReminder.person_email || 'Contact'} • ${state.activeReminder.company_name || 'Account'}` : 'Ready');
      updateButtons();
    }

    async function refreshConfigAndAuth() {
      const cfgRes = await API.getHostedConfig();
      if (!cfgRes?.success) throw new Error(cfgRes?.error || 'config_read_failed');
      state.config = cfgRes.config || {};

      els.backendInput.value = state.config.backendUrl || 'http://127.0.0.1:8788';
      els.frontendInput.value = state.config.frontendUrl || '';
      els.tenantInput.value = state.config.tenantId || '';
      els.modelInput.value = state.config.analysisModel || 'gpt-5-mini';
      els.lookaheadInput.value = String(state.config.lookaheadMinutes || 30);

      const authRes = await API.authStatus();
      state.auth = authRes || { authenticated: false };
      updateAuthSummary();
      updateButtons();
      await refreshOrgOptions();
      if (state.auth?.authenticated && !state.config?.tenantId && els.tenantSelect.value) {
        const autoTenant = String(els.tenantSelect.value || '').trim();
        if (autoTenant) {
          const autoCfg = await API.setHostedConfig({
            ...state.config,
            tenantId: autoTenant,
          });
          if (autoCfg?.success) {
            state.config = autoCfg.config || state.config;
            els.tenantInput.value = state.config.tenantId || '';
            updateAuthSummary();
            updateButtons();
          }
        }
      }

      if (state.auth?.authenticated) {
        const user = state.auth.user || {};
        setHeadline('Laserreach Intelli', `${user.username || user.email || 'Signed in'}${state.config.tenantId ? ` • ${state.config.tenantId}` : ''}`);
      } else {
        setHeadline('Laserreach Intelli', 'Sign in to start live call intelligence.');
      }
    }

    async function saveSettings() {
      const chosenTenant =
        els.tenantSelect.value.trim() ||
        els.tenantInput.value.trim() ||
        (state.config?.tenantId || '').trim();
      const next = {
        backendUrl: els.backendInput.value.trim(),
        frontendUrl: els.frontendInput.value.trim(),
        tenantId: chosenTenant,
        analysisModel: els.modelInput.value.trim() || 'gpt-5-mini',
        lookaheadMinutes: Number(els.lookaheadInput.value || 30),
      };
      const res = await API.setHostedConfig(next);
      if (!res?.success) throw new Error(res?.error || 'save_failed');
      state.config = res.config;
      els.tenantInput.value = state.config.tenantId || '';
      renderOrgOptions();
      showToast('Settings saved.');
      updateButtons();
      await refreshReminders();
    }

    async function refreshReminders() {
      if (!hasAuth()) {
        state.activeReminder = null;
        updateMeetingHeadline();
        return;
      }
      const out = await API.getHostedReminders();
      if (!out?.success) {
        updateMeetingHeadline();
        return;
      }
      const reminders = Array.isArray(out.reminders) ? out.reminders : [];
      state.activeReminder = reminders.length ? reminders[0] : null;
      updateMeetingHeadline();

      const r = state.activeReminder;
      if (!r) return;
      const inMinutes = Number(r.in_minutes || NaN);
      if (r.event_id && Number.isFinite(inMinutes) && inMinutes >= 0 && inMinutes <= 10 && state.lastReminderAlertId !== r.event_id) {
        state.lastReminderAlertId = r.event_id;
        await openMeetingPanel();
        showToast(`Meeting reminder: ${r.person_name || r.person_email || 'contact'} ${formatRelativeMinutes(r.scheduled_at || '')}`);
      }
    }

    async function refreshTranscriptPanelIfOpen() {
      if (!state.transcriptPanelLive) return;
      const listed = await API.listOverlayPanels();
      const keys = Array.isArray(listed?.keys) ? listed.keys : [];
      if (!keys.includes('live_transcript')) {
        state.transcriptPanelLive = false;
        return;
      }
      await openPanel(transcriptPanelPayload());
    }

    function queueTranscriptPanelRefresh() {
      if (!state.transcriptPanelLive) return;
      if (state.transcriptPanelRefreshTimer) {
        window.clearTimeout(state.transcriptPanelRefreshTimer);
      }
      state.transcriptPanelRefreshTimer = window.setTimeout(() => {
        refreshTranscriptPanelIfOpen().catch(() => {});
      }, 350);
    }

    async function runAutoInsightIfReady() {
      if (!state.autoInsightEnabled || !state.listening) return;
      if (state.autoInsightInFlight) return;
      const transcriptLen = state.transcript.length;
      if (transcriptLen < state.autoInsightMinChars) return;
      if ((transcriptLen - state.autoInsightLastAnalyzedLen) < 40) return;
      if ((Date.now() - state.autoInsightLastRunAt) < 20000) return;

      state.autoInsightInFlight = true;
      state.autoInsightLastRunAt = Date.now();
      try {
        const result = await runAnalysis(autoInsightPrompt(), 'full');
        state.autoInsightLastAnalyzedLen = transcriptLen;
        await openAnalysisPanels(result, { live: true });
      } catch (_) {
        // Keep silent during auto mode to avoid noisy toasts while call is active.
      } finally {
        state.autoInsightInFlight = false;
      }
    }

    function queueAutoInsight() {
      if (!state.autoInsightEnabled || !state.listening) return;
      if (state.autoInsightTimer) {
        window.clearTimeout(state.autoInsightTimer);
      }
      state.autoInsightTimer = window.setTimeout(() => {
        runAutoInsightIfReady().catch(() => {});
      }, 3200);
    }

    function bindEvents() {
      els.signinBtn.addEventListener('click', async () => {
        try {
          const out = await API.authOpenLogin();
          if (!out?.success) throw new Error(out?.error || 'signin_window_failed');
          showToast('Sign-in window opened. Complete login there.');
        } catch (err) {
          showToast(err.message || String(err), 'error', 4200);
        }
      });

      els.listenBtn.addEventListener('click', async () => {
        try {
          if (state.listening) {
            await stopListening();
          } else {
            await startListening();
          }
        } catch (err) {
          showToast(err.message || String(err), 'error', 4000);
          await stopListening();
        }
      });

      els.summaryBtn.addEventListener('click', async () => {
        try {
          const result = await runAnalysis(
            'Generate concise, tactical call guidance. Separate pain points from objections. Prioritize next best actions and concrete follow-up language. Keep it direct and sales-focused; no AI disclaimers.',
            'full',
          );
          await openAnalysisPanels(result);
        } catch (err) {
          showToast(err.message || String(err), 'error', 4200);
        }
      });

      els.meetingBtn.addEventListener('click', () => {
        openMeetingPanel().catch((err) => showToast(err.message || String(err), 'error'));
      });

      els.transcriptBtn.addEventListener('click', () => {
        openTranscriptPanel().catch((err) => showToast(err.message || String(err), 'error'));
      });

      els.askBtn.addEventListener('click', () => {
        els.promptDock.classList.toggle('visible');
        if (els.promptDock.classList.contains('visible')) {
          els.promptInput.focus();
        }
      });

      const runPrompt = async () => {
        const prompt = els.promptInput.value.trim();
        if (!prompt) return;
        els.promptInput.value = '';
        await askClarificationQuestion(prompt, { source: 'manual' });
      };

      els.sendPromptBtn.addEventListener('click', runPrompt);
      els.promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') runPrompt();
      });

      els.tenantSelect.addEventListener('change', () => {
        els.tenantInput.value = els.tenantSelect.value || '';
        saveSettings().catch((err) => showToast(err.message || String(err), 'error'));
      });

      els.settingsBtn.addEventListener('click', () => {
        els.settingsPanel.classList.toggle('show');
      });
      els.settingsCloseBtn.addEventListener('click', () => {
        els.settingsPanel.classList.remove('show');
      });
      els.saveSettingsBtn.addEventListener('click', () => {
        saveSettings().catch((err) => showToast(err.message || String(err), 'error'));
      });
      els.refreshOrgsBtn.addEventListener('click', () => {
        refreshOrgOptions().catch((err) => showToast(err.message || String(err), 'error'));
      });
      els.reauthBtn.addEventListener('click', async () => {
        const out = await API.authOpenLogin();
        if (!out?.success) showToast(out?.error || 'Failed to open sign-in', 'error');
      });
      els.signoutBtn.addEventListener('click', async () => {
        const out = await API.authSignOut();
        if (!out?.success) {
          showToast(out?.error || 'Sign out failed', 'error');
          return;
        }
        state.auth = { authenticated: false };
        state.transcript = '';
        state.transcriptSegments = [];
        state.clarificationPrompts = [];
        renderClarifyButtons();
        state.lastTranscriptSegment = '';
        state.transcriptPanelLive = false;
        await refreshConfigAndAuth();
        showToast('Signed out.');
      });

      els.pinBtn.addEventListener('click', async () => {
        const out = await API.windowTogglePin();
        if (out?.success) {
          state.pinned = Boolean(out.pinned);
          updateButtons();
        }
      });
      els.minBtn.addEventListener('click', () => API.windowMinimize());
      els.closeBtn.addEventListener('click', () => API.windowClose());

      API.onAuthUpdated(() => {
        refreshConfigAndAuth().catch(() => {});
      });
      API.onQuickAsk((payload) => {
        const q = String(payload?.question || '').trim();
        if (!q) return;
        askClarificationQuestion(q, { source: 'panel' }).catch(() => {});
      });

      API.onASRMessage((msg) => {
        if (!msg) return;
        if ((msg.op === 'transcript' || msg.op === 'final') && msg.text) {
          const isFinal = msg.isFinal === undefined ? true : Boolean(msg.isFinal || msg.speechFinal);
          if (!isFinal) return;
          const text = String(msg.text).trim();
          if (!text) return;
          if (text === state.lastTranscriptSegment) return;
          state.lastTranscriptSegment = text;
          state.transcriptSegments.push(text);
          state.transcript = `${state.transcript}\n${text}`.trim();
          queueTranscriptPanelRefresh();
          queueAutoInsight();
          if (state.sessionId) {
            API.sessionAppendTranscript(state.sessionId, { text, ts: nowIso() });
          }
        }
        if (msg.op === 'error') {
          showToast(msg.message || 'ASR error', 'error', 4500);
        }
      });

      API.onAnalysisResponse((event) => {
        const data = event?.data || {};
        const id = data.id;
        if (!id) return;
        const pending = state.pendingAnalysis.get(id);
        if (!pending) return;
        state.pendingAnalysis.delete(id);
        if (data.error) {
          pending.reject(new Error(data.error));
        } else {
          if (state.sessionId && data.results) {
            API.sessionAppendAnalysis(state.sessionId, { ts: nowIso(), results: data.results });
          }
          pending.resolve(data);
        }
      });

      API.onResponse((msg) => {
        if (msg?.error) showToast(msg.error, 'error');
      });

      API.onStatus((msg) => {
        if (!msg) return;
        if (msg.type === 'analysis-status') {
          const status = String(msg.status || '').toLowerCase();
          if (status === 'running') {
            setHeadline('Laserreach Intelli', 'Analyzing live call context...');
          } else if (status === 'done') {
            updateMeetingHeadline();
          }
        }
      });

      API.onModelStatus((status) => {
        if (status?.message) {
          setHeadline('Laserreach Intelli', status.message);
        }
      });
    }

    async function boot() {
      bindEvents();
      await refreshConfigAndAuth();
      updateMeetingHeadline();
      await refreshReminders();
      state.reminderTimer = window.setInterval(() => {
        refreshReminders().catch(() => {});
      }, 45000);
    }

    boot().catch((err) => {
      showToast(err.message || String(err), 'error', 5000);
    });
  </script>
</body>
</html>
