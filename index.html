<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laserreach Intelli</title>
  <link rel="icon" href="assets/laserreach-logo.png" />
  <style>
    :root {
      --bg: #05070d;
      --panel: #0f1320;
      --panel-2: #151b2b;
      --text: #f1f5ff;
      --muted: #9aa8c7;
      --blue: #4a88ff;
      --green: #2ed19a;
      --line: rgba(147, 173, 227, 0.22);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 0% 0%, rgba(76, 131, 255, 0.12), transparent 45%), var(--bg);
      overflow: hidden;
    }

    #app {
      position: fixed;
      inset: 14px;
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(11, 15, 24, 0.98), rgba(9, 12, 20, 0.98));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(20, 27, 42, 0.96), rgba(14, 20, 32, 0.92));
      -webkit-app-region: drag;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid rgba(134, 170, 255, 0.4);
      background: #101a2a;
    }

    .brand-title { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }
    .brand-subtitle { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #2d3c5d, #1f2d4a);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 120ms ease;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(180deg, #5294ff, #2e74eb); }
    .btn.success { background: linear-gradient(180deg, #29c98e, #16a872); }
    .btn.warn { background: linear-gradient(180deg, #f8aa52, #dc7f1f); }

    .main {
      display: grid;
      grid-template-columns: minmax(340px, 1.15fr) minmax(260px, 0.85fr);
      min-height: 0;
      overflow: hidden;
    }

    .timeline-panel,
    .bubble-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .timeline-panel {
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(17, 25, 40, 0.55), rgba(10, 15, 24, 0.4));
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      gap: 8px;
    }

    .panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: #c8d8fb; }
    .panel-meta { font-size: 12px; color: var(--muted); }

    .timeline {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      -webkit-app-region: no-drag;
    }

    .bubble {
      max-width: 92%;
      border-radius: 14px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      line-height: 1.35;
      font-size: 13px;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(180deg, rgba(68, 120, 236, 0.45), rgba(44, 88, 186, 0.45));
    }

    .bubble.ai {
      align-self: flex-start;
      background: linear-gradient(180deg, rgba(34, 182, 130, 0.25), rgba(21, 123, 88, 0.25));
    }

    .bubble.sys {
      align-self: center;
      background: linear-gradient(180deg, rgba(64, 78, 105, 0.4), rgba(44, 56, 81, 0.4));
      color: #d6e3ff;
      font-size: 12px;
    }

    .bubble small {
      display: block;
      margin-top: 6px;
      color: #b9c9eb;
      font-size: 11px;
    }

    .bubble-panel {
      background: linear-gradient(180deg, rgba(12, 18, 30, 0.65), rgba(8, 13, 24, 0.55));
    }

    .bubble-grid {
      overflow-y: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      -webkit-app-region: no-drag;
    }

    .insight-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: linear-gradient(160deg, rgba(29, 36, 54, 0.84), rgba(19, 26, 42, 0.84));
      display: grid;
      gap: 8px;
    }

    .insight-title {
      font-size: 12px;
      font-weight: 700;
      color: #d3def9;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .insight-body {
      font-size: 13px;
      line-height: 1.4;
      color: #f4f8ff;
      white-space: pre-wrap;
    }

    .insight-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      border-radius: 999px;
      padding: 3px 8px;
      border: 1px solid rgba(154, 184, 238, 0.35);
      color: #b8cdf1;
      background: rgba(32, 45, 72, 0.55);
    }

    .footer {
      border-top: 1px solid var(--line);
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      -webkit-app-region: no-drag;
      background: rgba(11, 16, 28, 0.94);
    }

    .prompt {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0f1728;
      color: var(--text);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
    }

    .reminder-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 14px 10px 14px;
      border-bottom: 1px solid var(--line);
      -webkit-app-region: no-drag;
      background: rgba(12, 18, 30, 0.75);
    }

    .reminder-card {
      min-width: 220px;
      border-radius: 12px;
      border: 1px solid rgba(97, 166, 255, 0.4);
      padding: 10px;
      background: linear-gradient(180deg, rgba(40, 72, 126, 0.35), rgba(23, 44, 81, 0.35));
      font-size: 12px;
      line-height: 1.35;
    }

    .reminder-card strong { display: block; font-size: 12px; margin-bottom: 4px; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 14, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
      -webkit-app-region: no-drag;
    }

    .modal.show { display: flex; }

    .modal-card {
      width: min(720px, 90vw);
      max-height: 86vh;
      overflow: auto;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #121a2c, #0d1322);
      box-shadow: var(--shadow);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field { display: grid; gap: 6px; }

    .field label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .field input, .field select {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0f1728;
      color: var(--text);
      padding: 10px;
      font-size: 13px;
      outline: none;
    }

    .full { grid-column: 1 / -1; }

    .empty {
      border: 1px dashed rgba(146, 171, 221, 0.4);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1080px) {
      .main { grid-template-columns: 1fr; }
      .timeline-panel { border-right: none; border-bottom: 1px solid var(--line); }
      .form-grid { grid-template-columns: 1fr; }
      .footer { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="brand">
        <img src="assets/laserreach-logo.png" alt="Laserreach" />
        <div>
          <div class="brand-title">Laserreach Intelli</div>
          <div id="brandSub" class="brand-subtitle">Hosted in-call intelligence · Deepgram + GPT-5-mini</div>
        </div>
      </div>
      <div class="controls">
        <button id="btnStart" class="btn success">Start Listening</button>
        <button id="btnStop" class="btn warn" disabled>Stop</button>
        <button id="btnSummary" class="btn">Summarize</button>
        <button id="btnActions" class="btn">Next Actions</button>
        <button id="btnSettings" class="btn primary">Settings</button>
      </div>
    </div>

    <div id="reminderStrip" class="reminder-strip"></div>

    <div class="main">
      <section class="timeline-panel">
        <div class="panel-head">
          <div class="panel-title">Conversation Timeline</div>
          <div id="sessionMeta" class="panel-meta">No active session</div>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>

      <section class="bubble-panel">
        <div class="panel-head">
          <div class="panel-title">Insight Bubbles</div>
          <div id="insightMeta" class="panel-meta">0 generated</div>
        </div>
        <div id="bubbleGrid" class="bubble-grid"></div>
      </section>
    </div>

    <div class="footer">
      <input id="prompt" class="prompt" placeholder="Ask Intelli something about this call..." />
      <div id="status" class="status">Ready.</div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <div class="panel-title" style="font-size:15px;">Hosted Backend Settings</div>
        <button id="btnCloseSettings" class="btn">Close</button>
      </div>
      <div class="form-grid">
        <div class="field full">
          <label for="cfgBackendUrl">Backend URL</label>
          <input id="cfgBackendUrl" type="text" placeholder="http://localhost:8788" />
        </div>
        <div class="field">
          <label for="cfgTenant">Tenant ID</label>
          <input id="cfgTenant" type="text" placeholder="orgl" />
        </div>
        <div class="field">
          <label for="cfgModel">Analysis Model</label>
          <select id="cfgModel">
            <option value="gpt-5-mini">gpt-5-mini</option>
            <option value="gpt-5-nano">gpt-5-nano</option>
          </select>
        </div>
        <div class="field full">
          <label for="cfgJwt">JWT Token</label>
          <input id="cfgJwt" type="password" placeholder="Paste auth token" />
        </div>
        <div class="field">
          <label for="cfgLookahead">Reminder Lookahead (minutes)</label>
          <input id="cfgLookahead" type="number" min="5" max="240" step="5" value="30" />
        </div>
        <div class="field">
          <label for="cfgPipeline">Default Pipeline ID (optional)</label>
          <input id="cfgPipeline" type="text" placeholder="pipeline UUID" />
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button id="btnSaveSettings" class="btn primary">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.electronAPI || {
      async getHostedConfig() {
        return {
          success: true,
          config: {
            backendUrl: 'http://localhost:8788',
            tenantId: 'orgl',
            jwtToken: 'browser-test-token',
            analysisModel: 'gpt-5-mini',
            lookaheadMinutes: 30,
            defaultPipelineId: '',
          },
        };
      },
      async setHostedConfig(config) { return { success: true, config }; },
      async getHostedReminders() {
        return {
          success: true,
          reminders: [
            {
              event_id: 'evt_browser_1',
              pipeline_id: 'pipe_browser_1',
              person_name: 'Browser Prospect',
              company_name: 'Mock Company',
              scheduled_at: new Date(Date.now() + 20 * 60 * 1000).toISOString(),
            },
          ],
          count: 1,
        };
      },
      sendPrompt(id, prompt) {
        setTimeout(() => {
          this._responseHandlers.forEach((fn) => fn({ id, response: `Mock response for: ${prompt}` }));
        }, 50);
      },
      sendAnalysisRequest(req) {
        setTimeout(() => {
          this._analysisHandlers.forEach((fn) => fn({ data: {
            id: req?.id,
            type: 'analysis-response',
            results: {
              summary: 'Mock analysis summary from browser fallback.',
              suggestions: {
                actionItems: ['Mock action 1', 'Mock action 2'],
                questions: ['Mock question'],
                topics: [],
                activities: [],
              },
            },
          }}));
        }, 80);
      },
      onResponse(fn) { this._responseHandlers.push(fn); },
      onAnalysisResponse(fn) { this._analysisHandlers.push(fn); },
      onASRMessage(fn) { this._asrHandlers.push(fn); },
      onModelStatus() {},
      onStatus() {},
      asrStart() {},
      asrSendChunkF32() {},
      asrStop() {},
      sessionStart() {},
      sessionAppendTranscript() {},
      sessionAppendAnalysis() {},
      sessionEnd() {},
      _responseHandlers: [],
      _analysisHandlers: [],
      _asrHandlers: [],
    };

    const state = {
      config: null,
      transcript: '',
      listening: false,
      sessionId: null,
      sessionStartedAt: null,
      insightCount: 0,
      media: {
        stream: null,
        context: null,
        source: null,
        processor: null,
      },
    };

    const timelineEl = document.getElementById('timeline');
    const bubbleGridEl = document.getElementById('bubbleGrid');
    const reminderStripEl = document.getElementById('reminderStrip');
    const statusEl = document.getElementById('status');
    const sessionMetaEl = document.getElementById('sessionMeta');
    const insightMetaEl = document.getElementById('insightMeta');
    const promptEl = document.getElementById('prompt');
    const brandSubEl = document.getElementById('brandSub');

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function nowLabel() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function appendTimeline(text, kind = 'sys') {
      const item = document.createElement('div');
      item.className = `bubble ${kind}`;
      item.textContent = text;
      const stamp = document.createElement('small');
      stamp.textContent = nowLabel();
      item.appendChild(stamp);
      timelineEl.appendChild(item);
      timelineEl.scrollTop = timelineEl.scrollHeight;
    }

    function addInsightCard(title, body, tags = []) {
      const card = document.createElement('div');
      card.className = 'insight-card';
      card.innerHTML = `<div class="insight-title"></div><div class="insight-body"></div><div class="insight-tags"></div>`;
      card.querySelector('.insight-title').textContent = title;
      card.querySelector('.insight-body').textContent = body;
      const tagsEl = card.querySelector('.insight-tags');
      for (const tag of tags) {
        const chip = document.createElement('span');
        chip.className = 'tag';
        chip.textContent = tag;
        tagsEl.appendChild(chip);
      }
      bubbleGridEl.prepend(card);
      state.insightCount += 1;
      insightMetaEl.textContent = `${state.insightCount} generated`;
    }

    function renderReminders(reminders) {
      reminderStripEl.innerHTML = '';
      if (!Array.isArray(reminders) || reminders.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.style.minWidth = '100%';
        empty.textContent = 'No upcoming meetings in the configured lookahead window.';
        reminderStripEl.appendChild(empty);
        return;
      }

      reminders.slice(0, 8).forEach((r) => {
        const card = document.createElement('div');
        card.className = 'reminder-card';
        const who = r.person_name || r.person_email || 'Unknown person';
        const company = r.company_name || 'Unknown company';
        const when = r.scheduled_at ? new Date(r.scheduled_at).toLocaleString() : 'unscheduled';
        card.innerHTML = `<strong>${who}</strong>${company}<br>${when}<br>Pipeline: ${r.pipeline_id || 'n/a'}`;
        reminderStripEl.appendChild(card);
      });
    }

    function updateSessionMeta() {
      if (!state.sessionId) {
        sessionMetaEl.textContent = 'No active session';
        return;
      }
      sessionMetaEl.textContent = `Session ${state.sessionId.slice(-8)} · ${state.listening ? 'listening' : 'idle'}`;
    }

    async function loadConfigToUI() {
      const res = await API.getHostedConfig();
      if (!res || !res.success) {
        setStatus(`Config load failed: ${res?.error || 'unknown error'}`);
        return;
      }
      state.config = res.config;
      document.getElementById('cfgBackendUrl').value = state.config.backendUrl || 'http://localhost:8788';
      document.getElementById('cfgTenant').value = state.config.tenantId || '';
      document.getElementById('cfgJwt').value = state.config.jwtToken || '';
      document.getElementById('cfgModel').value = state.config.analysisModel || 'gpt-5-mini';
      document.getElementById('cfgLookahead').value = String(state.config.lookaheadMinutes || 30);
      document.getElementById('cfgPipeline').value = state.config.defaultPipelineId || '';
      brandSubEl.textContent = `Hosted via ${state.config.backendUrl || 'http://localhost:8788'} · ${state.config.analysisModel || 'gpt-5-mini'}`;
    }

    function configFromUI() {
      return {
        backendUrl: (document.getElementById('cfgBackendUrl').value || '').trim() || 'http://localhost:8788',
        tenantId: (document.getElementById('cfgTenant').value || '').trim(),
        jwtToken: (document.getElementById('cfgJwt').value || '').trim(),
        analysisModel: (document.getElementById('cfgModel').value || 'gpt-5-mini').trim(),
        lookaheadMinutes: Number(document.getElementById('cfgLookahead').value || 30),
        defaultPipelineId: (document.getElementById('cfgPipeline').value || '').trim(),
      };
    }

    function requireConfigured() {
      const cfg = state.config || {};
      const missing = [];
      if (!cfg.backendUrl) missing.push('backendUrl');
      if (!cfg.tenantId) missing.push('tenantId');
      if (!cfg.jwtToken) missing.push('jwtToken');
      if (missing.length) {
        throw new Error(`Configure ${missing.join(', ')} in Settings`);
      }
      return cfg;
    }

    async function refreshReminders() {
      try {
        requireConfigured();
        const res = await API.getHostedReminders();
        if (!res.success) {
          renderReminders([]);
          setStatus(`Reminder error: ${res.error || 'unknown'}`);
          return;
        }
        renderReminders(res.reminders || []);
      } catch (err) {
        renderReminders([]);
      }
    }

    async function startListening() {
      if (state.listening) return;
      requireConfigured();

      state.sessionId = `sess_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
      state.sessionStartedAt = Date.now();

      await API.sessionStart(state.sessionId, {
        source: 'intelli_desktop',
        started_at: new Date().toISOString(),
      });

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      const context = new (window.AudioContext || window.webkitAudioContext)();
      const source = context.createMediaStreamSource(stream);
      const processor = context.createScriptProcessor(4096, 1, 1);

      processor.onaudioprocess = (event) => {
        if (!state.listening) return;
        const data = event.inputBuffer.getChannelData(0);
        const copy = new Float32Array(data.length);
        copy.set(data);
        API.asrSendChunkF32(copy);
      };

      source.connect(processor);
      processor.connect(context.destination);

      state.media = { stream, context, source, processor };
      state.listening = true;
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnStop').disabled = false;
      updateSessionMeta();

      API.asrStart({
        sampleRate: context.sampleRate,
        updateMs: 3200,
      });

      appendTimeline('Live listening started.', 'sys');
      setStatus('Listening...');
    }

    async function stopListening() {
      if (!state.listening) return;

      state.listening = false;
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnStop').disabled = true;

      const { stream, context, source, processor } = state.media;
      try { processor && processor.disconnect(); } catch (_) {}
      try { source && source.disconnect(); } catch (_) {}
      try { context && context.close(); } catch (_) {}
      try {
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
        }
      } catch (_) {}
      state.media = { stream: null, context: null, source: null, processor: null };

      API.asrStop();
      appendTimeline('Listening stopped.', 'sys');
      setStatus('Stopped.');

      if (state.sessionId) {
        await API.sessionEnd(state.sessionId, {
          ended_at: new Date().toISOString(),
          transcript_chars: state.transcript.length,
        });
      }
      updateSessionMeta();
    }

    async function runAnalysis(kind) {
      try {
        requireConfigured();
        const transcript = state.transcript.trim();
        if (!transcript) {
          setStatus('No transcript available yet.');
          return;
        }
        setStatus(`Running ${kind} analysis...`);
        API.sendAnalysisRequest({
          id: `analysis_${Date.now()}`,
          transcript,
          analysisType: kind,
          context: {
            customPrompt: promptEl.value.trim() || undefined,
          },
        });
      } catch (err) {
        setStatus(String(err.message || err));
      }
    }

    document.getElementById('btnStart').addEventListener('click', () => {
      startListening().catch((err) => {
        appendTimeline(`Start failed: ${String(err.message || err)}`, 'sys');
        setStatus(`Start failed: ${String(err.message || err)}`);
      });
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      stopListening().catch((err) => {
        setStatus(`Stop failed: ${String(err.message || err)}`);
      });
    });

    document.getElementById('btnSummary').addEventListener('click', () => runAnalysis('summary'));
    document.getElementById('btnActions').addEventListener('click', () => runAnalysis('full'));

    promptEl.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || event.shiftKey) return;
      event.preventDefault();
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      appendTimeline(prompt, 'user');
      setStatus('Querying hosted analysis...');
      API.sendPrompt(`prompt_${Date.now()}`, prompt, state.transcript.slice(-6000));
      promptEl.value = '';
    });

    const settingsModal = document.getElementById('settingsModal');
    document.getElementById('btnSettings').addEventListener('click', () => {
      settingsModal.classList.add('show');
      loadConfigToUI().catch(() => {});
    });

    document.getElementById('btnCloseSettings').addEventListener('click', () => {
      settingsModal.classList.remove('show');
    });

    document.getElementById('btnSaveSettings').addEventListener('click', async () => {
      const res = await API.setHostedConfig(configFromUI());
      if (!res || !res.success) {
        setStatus(`Save failed: ${res?.error || 'unknown error'}`);
        return;
      }
      state.config = res.config;
      brandSubEl.textContent = `Hosted via ${state.config.backendUrl} · ${state.config.analysisModel}`;
      settingsModal.classList.remove('show');
      setStatus('Settings saved.');
      await refreshReminders();
    });

    API.onASRMessage((msg) => {
      if (!msg) return;
      if (msg.op === 'final') {
        const text = String(msg.text || '').trim();
        if (!text) return;
        state.transcript += (state.transcript ? '\n' : '') + text;
        appendTimeline(text, 'ai');
        if (state.sessionId) {
          API.sessionAppendTranscript(state.sessionId, {
            text,
            ts: new Date().toISOString(),
          });
        }
        setStatus('Transcript updated.');
        return;
      }
      if (msg.op === 'error') {
        appendTimeline(`ASR error: ${msg.message || 'unknown error'}`, 'sys');
        setStatus(`ASR error: ${msg.message || 'unknown error'}`);
        return;
      }
      if (msg.op === 'status') {
        setStatus(String(msg.message || 'ASR status updated'));
      }
    });

    API.onResponse((msg) => {
      if (!msg) return;
      if (msg.error) {
        appendTimeline(`Prompt error: ${msg.error}`, 'sys');
        setStatus(`Prompt error: ${msg.error}`);
        return;
      }
      const text = String(msg.response || '').trim();
      if (!text) return;
      addInsightCard('Prompt Response', text, ['hosted', 'direct']);
      if (state.sessionId) {
        API.sessionAppendAnalysis(state.sessionId, {
          type: 'prompt_response',
          text,
          ts: new Date().toISOString(),
        });
      }
      setStatus('Prompt response ready.');
    });

    API.onAnalysisResponse(({ data }) => {
      if (!data) return;
      if (data.error) {
        appendTimeline(`Analysis error: ${data.error}`, 'sys');
        setStatus(`Analysis error: ${data.error}`);
        return;
      }

      const summary = data.results?.summary || '';
      const actions = data.results?.suggestions?.actionItems || [];
      const questions = data.results?.suggestions?.questions || [];

      if (summary) {
        addInsightCard('Summary', typeof summary === 'string' ? summary : JSON.stringify(summary, null, 2), ['summary']);
      }
      if (Array.isArray(actions) && actions.length) {
        addInsightCard('Next Best Actions', actions.map((a, i) => `${i + 1}. ${typeof a === 'string' ? a : JSON.stringify(a)}`).join('\n'), ['actions']);
      }
      if (Array.isArray(questions) && questions.length) {
        addInsightCard('Discovery Questions', questions.map((q, i) => `${i + 1}. ${typeof q === 'string' ? q : JSON.stringify(q)}`).join('\n'), ['questions']);
      }

      if (state.sessionId) {
        API.sessionAppendAnalysis(state.sessionId, {
          type: 'analysis',
          data: data.results,
          ts: new Date().toISOString(),
        });
      }
      setStatus('Analysis complete.');
    });

    API.onModelStatus((status) => {
      if (status?.message) setStatus(status.message);
    });

    async function boot() {
      timelineEl.innerHTML = '<div class="empty">Start listening to begin live transcription and generate revenue intelligence bubbles.</div>';
      bubbleGridEl.innerHTML = '<div class="empty">Summaries, objections, next actions, and questions appear here as reusable insight bubbles.</div>';
      await loadConfigToUI();
      await refreshReminders();
      setInterval(() => {
        refreshReminders().catch(() => {});
      }, 30000);
      updateSessionMeta();
      setStatus('Hosted Intelli ready.');
    }

    boot().catch((err) => {
      setStatus(`Startup error: ${String(err.message || err)}`);
    });
  </script>
</body>
</html>
